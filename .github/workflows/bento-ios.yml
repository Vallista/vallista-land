# 루틴 iOS 앱(apps/bento-ios) — RoutineKit 단위 시험 + 앱·위젯 빌드(서명 없이 시뮬레이터용).
# 블로그 배포(node.js.yml)와 따로 돈다. apps/bento-ios 가 바뀐 push 에서만.
# 실패하면 오류 줄이 실행 화면의 Annotations 에 모인다 (apps/bento-ios/ci/run.sh).
name: Bento iOS

on:
  push:
    paths:
      - "apps/bento-ios/**"
      - ".github/workflows/bento-ios.yml"
  workflow_dispatch:

concurrency:
  group: bento-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      # 파일마다 형 검사 — 첫 오류에서 멈추지 않고 모듈 전체의 오류를 한 번에 모은다.
      - name: RoutineKit 형 검사
        working-directory: apps/bento-ios/Packages/RoutineKit
        run: >
          ../../ci/run.sh "RoutineKit 형 검사" xcrun swiftc -typecheck
          -sdk "$(xcrun --show-sdk-path --sdk macosx)" -target arm64-apple-macosx14.0
          Sources/RoutineKit/*.swift

      - name: RoutineKit 시험
        if: always()
        working-directory: apps/bento-ios/Packages/RoutineKit
        run: ../../ci/run.sh "RoutineKit 시험" swift test

      - name: 프로젝트 만들기 (XcodeGen)
        if: always() && hashFiles('apps/bento-ios/project.yml') != ''
        working-directory: apps/bento-ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 앱 빌드 (시뮬레이터, 서명 없음)
        if: always() && hashFiles('apps/bento-ios/project.yml') != ''
        working-directory: apps/bento-ios
        run: >
          ci/run.sh "앱 빌드" xcodebuild -project BentoRoutine.xcodeproj -scheme BentoRoutine
          -destination 'generic/platform=iOS Simulator' -configuration Debug
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      # 커밋 메시지에 [shots] 가 있을 때만: 시뮬레이터 스크린샷을 ci/bento-ios-shots 가지(한 커밋, 덮어씀)에 올린다.
      - name: 스크린샷
        if: contains(github.event.head_commit.message, '[shots]')
        working-directory: apps/bento-ios
        run: ci/run.sh "스크린샷" ci/shots.sh "$RUNNER_TEMP/shots"

      - name: 스크린샷 올리기
        if: always() && contains(github.event.head_commit.message, '[shots]')
        run: |
          cd "$RUNNER_TEMP/shots" || exit 0
          ls *.png >/dev/null 2>&1 || exit 0
          git init -q -b shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "bento-ios screenshots ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots:ci/bento-ios-shots
          echo "::notice title=스크린샷::ci/bento-ios-shots 에 $(ls *.png | wc -l | tr -d ' ')장"
