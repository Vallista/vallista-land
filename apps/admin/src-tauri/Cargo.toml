[package]
name = "bento"
version = "0.0.1"
description = "Bento — vallista's personal daily companion"
authors = ["vallista"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "bento_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
gray_matter = "0.2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json"] }
scraper = "0.20"
ego-tree = "0.6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "io-util", "process", "fs", "net"] }
feed-rs = "2"
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
futures = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
chrono = "0.4"
chrono-tz = "0.10"
regex = "1"
once_cell = "1"
sha2 = "0.10"
arboard = { version = "3", default-features = false }
async-imap = { version = "0.9", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.5", default-features = false, features = ["runtime-tokio"] }
mailparse = "0.14"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
rand = { version = "0.8", features = ["getrandom"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
security-framework = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
sha1 = "0.10"
pbkdf2 = "0.12"
aes = "0.8"
cbc = "0.1"
aes-gcm = "0.10"
cipher = { version = "0.4", features = ["block-padding"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDate", "NSString", "NSPredicate", "NSEnumerator"] }
objc2-event-kit = { version = "0.3", features = ["EKTypes", "EKEventStore", "EKEvent", "EKCalendar", "EKObject", "EKCalendarItem", "EKParticipant", "block2"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
